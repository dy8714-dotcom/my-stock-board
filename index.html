<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイ株価ボード</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#cfd5dc;color:#1c2733;line-height:1.25;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --up:#0b7a35;--dn:#c8102e;--upBg:#eef5c9;--dnBg:#fde6e6;--upFill:rgba(11,122,53,.14);--dnFill:rgba(200,16,46,.14)}
body.jp{--up:#c8102e;--dn:#0b5cad;--upBg:#fde6e6;--dnBg:#e3eefb;--upFill:rgba(200,16,46,.14);--dnFill:rgba(11,92,173,.14)}
#app{max-width:2400px;margin:0 auto;padding:10px 12px;min-height:100vh;display:flex;flex-direction:column;gap:8px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 24px}
.ttl{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
h1{margin:0;font-size:22px;font-weight:700}
.sub{font-size:14px}
.cap{font-size:12px;color:#2c3844}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.lbl{font-size:13px;font-weight:700}
.btn{min-height:44px;padding:0 14px;font:700 14px inherit;font-family:inherit;border:1px solid #1d4f91;border-radius:4px;background:#fff;color:#1d4f91;cursor:pointer}
.btn[aria-pressed="true"]{background:#1d4f91;color:#fff}
.btn:focus-visible,.lnk:focus-visible{outline:3px solid #1d4f91;outline-offset:2px}
.lnk{font-size:12px;color:#1d3f6e;text-decoration:underline}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{min-height:48px;padding:0 18px;text-align:left;line-height:1.3;font-weight:700;font-size:15px;font-family:inherit;border:1px solid #1d4f91;border-bottom:3px solid #1d4f91;border-radius:4px 4px 0 0;background:#e9eef5;color:#1d4f91;cursor:pointer}
.tab[aria-selected="true"]{background:#fff;color:#1b1f24;border-bottom-color:#fff}
.tm{display:block;font-size:11px;font-weight:400;color:#2c3844}
.tm.old{color:#8a3b00}
.tab:focus-visible{outline:3px solid #1d4f91;outline-offset:2px}
#msg{display:none;padding:8px 12px;border-radius:4px;background:#fff3cd;color:#5c4400;font-size:13px}
.grid{display:grid;gap:6px;align-items:stretch}
.tile{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff;border:1px solid #aeb5be;border-radius:3px;overflow:hidden;color:inherit;text-decoration:none}
.tile:hover{box-shadow:0 0 0 2px #1d4f91}
.tile:focus-visible{outline:3px solid #1d4f91;outline-offset:1px}
.th{display:flex;align-items:baseline;gap:6px;padding:5px 8px 3px}
.nm{font-size:var(--name);font-weight:700;color:#1b1f24;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cd{font-size:var(--code);color:#44505c;flex:none;font-variant-numeric:tabular-nums}
.no{font-size:10px;color:#55606b;flex:none}
.cat{height:18px;flex:none;box-sizing:border-box;padding:2px 6px;font-size:11px;font-weight:700;line-height:14px;color:#1b1f24;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xr{display:flex;justify-content:space-between;gap:4px;padding:1px 8px;font-size:var(--xs,11px);color:#44505c;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.xr b{color:#1b1f24}
.xr .u{color:var(--up)}.xr .d{color:var(--dn)}
.rg{padding:2px 8px 1px}
.rg .t{display:flex;justify-content:space-between;font-size:calc(var(--xs,11px) - 1px);color:#55606b;white-space:nowrap}
.rg .bar{position:relative;height:6px;background:#e1e5ea;border-radius:3px;margin-top:2px}
.rg .bar i{position:absolute;top:-2px;width:3px;height:10px;background:#1b1f24}
.sp{padding-bottom:6px}
.ma5{fill:none;stroke:#e08a00;stroke-width:1.3;vector-effect:non-scaling-stroke}
.ma25{fill:none;stroke:#6a3fb5;stroke-width:1.3;vector-effect:non-scaling-stroke}
.vb{fill:#c9ced6}
.vu{fill:#e8a0a8}.vd{fill:#9ab9dc}
#showPanel{display:none;background:#fff;border:1px solid #8a94a0;border-radius:4px;padding:8px 12px;font-size:13px}
#showPanel.on{display:block}
#showPanel label{display:inline-flex;align-items:center;gap:4px;margin:2px 14px 2px 0;cursor:pointer}
.sel{font:inherit;font-size:13px;padding:5px 6px;border:1px solid #8a94a0;border-radius:4px;background:#fff;color:#1b1f24}
.cw{vector-effect:non-scaling-stroke;stroke-width:1}
.cu .cw{stroke:var(--up)}.cd2 .cw{stroke:var(--dn)}
.cu .cb2{fill:var(--up);stroke:var(--up)}.cd2 .cb2{fill:#fff;stroke:var(--dn)}
.cb2{vector-effect:non-scaling-stroke;stroke-width:1}
.catlbl{position:relative;z-index:2;align-self:start;height:18px;margin:1px 1px 0;box-sizing:border-box;padding:2px 6px;font-size:11px;font-weight:700;line-height:14px;color:#1b1f24;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;border-radius:2px 2px 0 0}
.tag{flex:none;font-size:10px;padding:0 4px;border-radius:2px;background:#fff3cd;color:#5c4400}
.band{padding:1px 8px;text-align:center;background:#eef0f3}
.up .band{background:var(--upBg)}
.dn .band{background:var(--dnBg)}
.pct{display:block;font-size:var(--pct);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;color:#55606b}
.up .pct,.up .ch{color:var(--up)}
.dn .pct,.dn .ch{color:var(--dn)}
.chart{flex:none;height:var(--chh,100px);position:relative}
.chart svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.base{stroke:#6b7480;stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.ln{fill:none;stroke-width:1.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.c-up .ln{stroke:var(--up)}
.c-dn .ln{stroke:var(--dn)}
.c-up .ar{fill:var(--upFill)}
.c-dn .ar{fill:var(--dnFill)}
.nodata{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:12px;color:#55606b}
.tp{display:flex;justify-content:space-between;align-items:baseline;gap:4px;padding:3px 8px 6px;font-variant-numeric:tabular-nums}
.pr{font-size:var(--price);font-weight:700;color:#1b1f24}
.ch{font-size:var(--chg);font-weight:700;color:#55606b}
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <div class="ttl">
      <h1 id="title">マイ株価ボード</h1>
      <span class="sub" id="sub"></span>
      <span class="cap" id="cap"></span>
    </div>
    <div class="ctl">
      <div class="grp"><span class="lbl">チャート</span><span id="periodBtns" class="grp"></span></div>
      <div class="grp"><span class="lbl">列数</span><span id="sizeBtns" class="grp"></span></div>
      <div class="grp"><span class="lbl">日足・週足の形</span><button type="button" class="btn" id="candleBtn" aria-pressed="false">ローソク足</button></div>
      <div class="grp"><button type="button" class="btn" id="showBtn" aria-expanded="false">表示項目</button></div>
      <div class="grp"><label class="lbl" for="siteSel">開くサイト</label><select id="siteSel" class="sel"></select></div>
      <div class="grp">
        <button type="button" class="btn" id="jpBtn" aria-pressed="false">日本式配色（上昇=赤）</button>
        <a class="lnk" id="editLink" href="#" target="_blank" rel="noopener" hidden>銘柄を編集</a>
      </div>
    </div>
  </div>
  <div id="showPanel" role="group" aria-label="表示する項目"></div>
  <div class="tabs" id="tabs" role="tablist" hidden></div>
  <div id="msg" role="status"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
(function () {
  'use strict';

  var SIZES = [6, 7, 8, 9, 10];
  var SHOW_ITEMS = [
    { key: 'no', label: '番号（#1…）' },
    { key: 'ma', label: '移動平均線（5日・25日／ローソク足のとき）' },
    { key: 'vol', label: '出来高の棒（日足・週足）' },
    { key: 'hl', label: '当日の高値・安値' },
    { key: 'vr', label: '出来高の倍率' },
    { key: 'rng', label: '52週の高値・安値の位置' },
    { key: 'rsi', label: 'RSI' },
    { key: 'dev', label: '25日乖離率' },
    { key: 'ret', label: '1週・1か月・3か月の騰落率' },
    { key: 'ytd', label: '「年初来高値」の印' }
  ];
  var LOOK = {
    6: { chh: 130, xs: 11, name: 15, pct: 30, price: 20, chg: 14, code: 11 },
    7: { chh: 118, xs: 11, name: 14, pct: 26, price: 18, chg: 13, code: 11 },
    8: { chh: 104, xs: 10, name: 13, pct: 22, price: 16, chg: 12, code: 10 },
    9: { chh: 92, xs: 10, name: 12, pct: 19, price: 14, chg: 11, code: 9 },
    10: { chh: 80, xs: 9, name: 11, pct: 17, price: 13, chg: 10, code: 9 }
  };
  var PERIODS = [
    { key: 'day', label: '当日', cap: '当日の値動き（点線＝前日終値）' },
    { key: 'daily', label: '日足', cap: '日足 約3か月（点線＝期間の初値）' },
    { key: 'weekly', label: '週足', cap: '週足 約1年（点線＝期間の初値）' }
  ];
  var SITES = [
    { key: 'kabutan', label: '株探' },
    { key: 'yahoo', label: 'Yahoo!ファイナンス' },
    { key: 'shikiho', label: '四季報オンライン' },
    { key: 'monex', label: 'マネックス 銘柄スカウター' },
    { key: 'tv', label: 'TradingView' }
  ];
  // 日本株の銘柄コードから、選んだサイトのページを作る（日本株以外は、Yahoo!ファイナンスを開く）
  function siteLink(kind, code, symbol) {
    var c = encodeURIComponent(code);
    if (kind !== 'jp') return 'https://finance.yahoo.com/quote/' + encodeURIComponent(symbol);
    switch (state.site) {
      case 'yahoo': return 'https://finance.yahoo.co.jp/quote/' + c + '.T';
      case 'shikiho': return 'https://shikiho.toyokeizai.net/stocks/' + c;
      case 'monex': return 'https://monex.ifis.co.jp/index.php?sa=report_zaimu&bcode=' + c;
      case 'tv': return 'https://www.tradingview.com/chart/?symbol=' + encodeURIComponent('TSE:' + code);
      default: return 'https://kabutan.jp/stock/?code=' + c;
    }
  }
  var SVGNS = 'http://www.w3.org/2000/svg';

  function load(key, def) {
    try { var v = window.localStorage.getItem('myBoard.' + key); return v === null ? def : v; } catch (e) { return def; }
  }
  function save(key, val) {
    try { window.localStorage.setItem('myBoard.' + key, String(val)); } catch (e) { /* 保存できなくても動作に影響なし */ }
  }

  var state = {
    size: Number(load('size', '8')),
    period: load('period', 'day'),
    jp: load('jp', '0') === '1',
    tab: load('tab', ''),
    candle: load('candle', '0') === '1',
    site: load('site', 'kabutan'),
    show: {}
  };
  (function () {
    var d = { no: 1, ma: 1, vol: 1, hl: 1, vr: 1, rng: 1, rsi: 1, dev: 1, ret: 1, ytd: 1 };
    var saved = {};
    try { saved = JSON.parse(load('show', '{}')) || {}; } catch (e) { saved = {}; }
    for (var k in d) state.show[k] = saved[k] === undefined ? d[k] : saved[k];
  })();
  if (SIZES.indexOf(state.size) < 0) state.size = 8;
  if (!SITES.some(function (x) { return x.key === state.site; })) state.site = 'kabutan';
  if (!PERIODS.some(function (p) { return p.key === state.period; })) state.period = 'day';

  var watch = { title: 'マイ株価ボード', tabs: [{ id: 'all', name: '', items: [] }] };
  var data = { items: {}, updatedAt: null };
  var notices = [];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function svgEl(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function fmt(n, dec) {
    return n.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  }

  // 古い形式（items だけ）も、新しい形式（tabs）も読めるようにする
  function getTabs() {
    if (watch && Array.isArray(watch.tabs) && watch.tabs.length) return watch.tabs;
    return [{ id: 'all', name: '', items: (watch && watch.items) || [] }];
  }
  function currentTab() {
    var tabs = getTabs();
    for (var i = 0; i < tabs.length; i++) if (tabs[i].id === state.tab) return tabs[i];
    return tabs[0];
  }
  var PALETTE = ['#bfe3dc', '#f6d99a', '#c4d8f2', '#dccbf0', '#f4c9d0', '#d6e8b8', '#f3c7a6', '#cfd8e3'];
  function jstParts(ms) {
    var d = new Date(ms + 9 * 3600 * 1000);
    return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), hh: d.getUTCHours(), mm: d.getUTCMinutes(), day: Math.floor((ms + 9 * 3600 * 1000) / 86400000) };
  }
  function tabTime(tab) {
    var min = null;
    (tab.items || []).forEach(function (it) {
      var rec = data.items ? data.items[it.symbol] : null;
      if (rec && rec.at) {
        var t = Date.parse(rec.at);
        if (isFinite(t) && (min === null || t < min)) min = t;
      }
    });
    return min;
  }
  function renderTabs() {
    var tabs = getTabs();
    var box = document.getElementById('tabs');
    while (box.firstChild) box.removeChild(box.firstChild);
    box.hidden = tabs.length < 2;
    var cur = currentTab();
    tabs.forEach(function (t) {
      var b = el('button', 'tab', t.name || t.id);
      var tt = tabTime(t);
      if (tt !== null) {
        var P = jstParts(tt);
        var latest = 0;
        getTabs().forEach(function (x) { var v = tabTime(x); if (v !== null && v > latest) latest = v; });
        var diff = jstParts(latest).day - P.day;
        var label = P.m + '/' + P.d + ' ' + (P.hh < 10 ? '0' : '') + P.hh + ':' + (P.mm < 10 ? '0' : '') + P.mm;
        if (diff >= 1) label += diff === 1 ? '（前日）' : '（' + diff + '日前）';
        b.appendChild(el('span', 'tm' + (diff >= 1 ? ' old' : ''), label));
      }
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', t === cur ? 'true' : 'false');
      b.addEventListener('click', function () { state.tab = t.id; save('tab', t.id); render(); });
      box.appendChild(b);
    });
  }

  // watchlist.json の1件を、表示用に整える
  function norm(it) {
    var s = String(it.symbol || '');
    var kind = it.kind || (/\.T$/.test(s) ? 'jp' : (/=X$/.test(s) ? 'fx' : (/^\^/.test(s) ? 'idx' : 'us')));
    var code = it.code || s.replace(/\.T$/, '').replace(/^\^/, '').replace(/=X$/, '');
    var dec = (it.decimals !== undefined && it.decimals !== null) ? Number(it.decimals) : (kind === 'fx' ? 3 : (kind === 'jp' ? 0 : 2));
    var link = it.link || siteLink(kind, code, s);
    return { cat: String(it.cat || ''), symbol: s, name: it.name || s, code: code, kind: kind, dec: dec, decFixed: (it.decimals !== undefined && it.decimals !== null), link: link };
  }

  function sma(vals, k) {
    var out = [], sum = 0, i;
    for (i = 0; i < vals.length; i++) {
      sum += vals[i];
      if (i >= k) sum -= vals[i - k];
      out.push(i >= k - 1 ? sum / k : null);
    }
    return out;
  }
  // 保存してある4本値・出来高から、表示する本数ぶんと移動平均線を用意する
  function prepCandles(rec) {
    var daily = state.period === 'daily';
    var ob = daily ? rec.dailyOhlc : rec.weeklyOhlc;
    if (!ob || ob.length < 2) return null;
    var ov = daily ? rec.dailyVol : rec.weeklyVol;
    var shown = Math.min(ob.length, daily ? 62 : 52);
    var closes = ob.map(function (b) { return b[3]; });
    var m5 = sma(closes, 5), m25 = sma(closes, 25);
    var from = ob.length - shown;
    return { bars: ob.slice(from), vols: ov && ov.length === ob.length ? ov.slice(from) : null, m5: m5.slice(from), m25: m25.slice(from) };
  }
  // ローソク足のSVGを作る。pc: prepCandles の結果
  function candleBox(pc) {
    var box = el('div', 'chart');
    var bars = pc ? pc.bars : null;
    var n = bars ? bars.length : 0, i;
    if (n < 2) { box.appendChild(el('div', 'nodata', 'チャートなし')); return box; }
    var showVol = state.show.vol && pc.vols;
    var showMa = state.show.ma;
    var bottom = showVol ? 52 : 66;
    var mn = Infinity, mx = -Infinity;
    for (i = 0; i < n; i++) { if (bars[i][2] < mn) mn = bars[i][2]; if (bars[i][1] > mx) mx = bars[i][1]; }
    var span = (mx - mn) || 1;
    mn -= span * 0.08; mx += span * 0.08; span = mx - mn;
    function Y(v) { return Math.round((4 + (mx - v) / span * (bottom - 4)) * 10) / 10; }
    var step = 200 / n, bw = Math.max(step * 0.62, 0.6);
    var svg = svgEl('svg', { viewBox: '0 0 200 70', preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    if (showVol) {
      var vm = 0;
      for (i = 0; i < n; i++) if (pc.vols[i] > vm) vm = pc.vols[i];
      if (vm > 0) for (i = 0; i < n; i++) {
        var vh = pc.vols[i] / vm * 15;
        if (vh <= 0) continue;
        svg.appendChild(svgEl('rect', { 'class': bars[i][3] >= bars[i][0] ? 'vu' : 'vd', x: String(Math.round(((i + 0.5) * step - bw / 2) * 100) / 100), width: String(Math.round(bw * 100) / 100), y: String(Math.round((69 - vh) * 10) / 10), height: String(Math.round(vh * 10) / 10) }));
      }
    }
    for (i = 0; i < n; i++) {
      var b = bars[i], x = Math.round((i + 0.5) * step * 100) / 100;
      var g = svgEl('g', { 'class': b[3] >= b[0] ? 'cu' : 'cd2' });
      g.appendChild(svgEl('line', { 'class': 'cw', x1: String(x), x2: String(x), y1: String(Y(b[1])), y2: String(Y(b[2])) }));
      var yt = Y(Math.max(b[0], b[3])), yb = Y(Math.min(b[0], b[3]));
      g.appendChild(svgEl('rect', { 'class': 'cb2', x: String(Math.round((x - bw / 2) * 100) / 100), width: String(Math.round(bw * 100) / 100), y: String(yt), height: String(Math.max(yb - yt, 0.8)) }));
      svg.appendChild(g);
    }
    if (showMa) {
      [['ma5', pc.m5], ['ma25', pc.m25]].forEach(function (m) {
        var pts = [];
        for (var j = 0; j < n; j++) if (m[1][j] !== null && m[1][j] !== undefined) pts.push((Math.round((j + 0.5) * step * 10) / 10) + ',' + Y(m[1][j]));
        if (pts.length > 1) svg.appendChild(svgEl('polyline', { 'class': m[0], points: pts.join(' ') }));
      });
    }
    box.appendChild(svg);
    return box;
  }

  // 折れ線のSVGを作る。values: 数値配列 / base: 点線の位置
  function chartBox(values, base) {
    var box = el('div', 'chart');
    if (!values || values.length < 2 || !isFinite(base)) {
      box.appendChild(el('div', 'nodata', 'チャートなし'));
      return box;
    }
    var mn = base, mx = base, i;
    for (i = 0; i < values.length; i++) { if (values[i] < mn) mn = values[i]; if (values[i] > mx) mx = values[i]; }
    var span = (mx - mn) || 1;
    mn -= span * 0.1; mx += span * 0.1; span = mx - mn;
    function Y(v) { return Math.round((4 + (mx - v) / span * 62) * 10) / 10; }
    var pts = [], n = values.length;
    for (i = 0; i < n; i++) pts.push((Math.round(i * 200 / (n - 1) * 10) / 10) + ',' + Y(values[i]));
    var by = Y(base);
    var up = values[n - 1] >= base;
    box.className = 'chart ' + (up ? 'c-up' : 'c-dn');
    var svg = svgEl('svg', { viewBox: '0 0 200 70', preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    svg.appendChild(svgEl('polygon', { 'class': 'ar', points: pts.join(' ') + ' 200,' + by + ' 0,' + by }));
    svg.appendChild(svgEl('line', { 'class': 'base', x1: '0', x2: '200', y1: String(by), y2: String(by) }));
    svg.appendChild(svgEl('polyline', { 'class': 'ln', points: pts.join(' ') }));
    box.appendChild(svg);
    return box;
  }

  function buildTile(item, index, catInfo) {
    var rec = data.items ? data.items[item.symbol] : null;
    var has = rec && typeof rec.price === 'number';
    var a = el('a', 'tile');
    a.href = item.link;
    a.target = '_blank';
    a.rel = 'noopener';

    if (catInfo && catInfo.has) {
      var cb = el('div', 'cat', '');
      cb.style.background = catInfo.bg;
      a.appendChild(cb);
    }
    var th = el('div', 'th');
    if (state.show.no) th.appendChild(el('span', 'no', '#' + (index + 1)));
    th.appendChild(el('span', 'cd', item.code));
    th.appendChild(el('span', 'nm', item.name));
    if (has && rec.stale) th.appendChild(el('span', 'tag', '前回分'));
    if (has && state.show.ytd && rec.ex && rec.ex.ytd === 1) th.appendChild(el('span', 'tag', '年初来高値'));
    a.appendChild(th);

    var band = el('div', 'band');
    var pct = el('span', 'pct', '—');
    band.appendChild(pct);
    a.appendChild(band);

    var values = null, base = NaN;
    if (has) {
      if (state.period === 'day') { values = rec.day; base = rec.prev; }
      else { values = state.period === 'daily' ? rec.daily : rec.weekly; base = values && values.length ? values[0] : NaN; }
    }
    var pc = null;
    if (has && state.candle && state.period !== 'day') pc = prepCandles(rec);
    a.appendChild(pc ? candleBox(pc) : chartBox(values, base));

    var tp = el('div', 'tp');
    var pr = el('span', 'pr', '—');
    var ch = el('span', 'ch', '');
    tp.appendChild(pr);
    tp.appendChild(ch);
    a.appendChild(tp);

    if (has) {
      var dec = item.dec;
      if (item.kind === 'jp' && !item.decFixed && rec.price < 1000 && rec.price % 1 !== 0) dec = 1;
      pr.textContent = fmt(rec.price, dec);
      if (typeof rec.prev === 'number' && rec.prev !== 0) {
        var diff = rec.price - rec.prev;
        var p = diff / rec.prev * 100;
        var sign = diff > 0 ? '+' : (diff < 0 ? '-' : '');
        pct.textContent = sign + Math.abs(p).toFixed(2) + '%';
        ch.textContent = sign + fmt(Math.abs(diff), dec);
        a.className += diff > 0 ? ' up' : (diff < 0 ? ' dn' : '');
      }
      appendExtras(a, rec, dec);
    } else {
      pr.textContent = 'データなし';
    }
    return a;
  }

  function pctSpan(v) {
    if (typeof v !== 'number') return null;
    var sp = el('span', v > 0 ? 'u' : (v < 0 ? 'd' : ''), (v > 0 ? '+' : '') + v + '%');
    return sp;
  }
  function xrow(left, right) {
    var r = el('div', 'xr');
    var l = el('span'), rr = el('span');
    [].concat(left).forEach(function (x) { if (x) l.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); });
    [].concat(right).forEach(function (x) { if (x) rr.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); });
    r.appendChild(l); r.appendChild(rr);
    return r;
  }
  function bold(t) { return el('b', '', t); }
  // 追加の項目（拡張機能が計算して保存した rec.ex を表示します）
  function appendExtras(a, rec, dec) {
    var ex = rec.ex;
    if (!ex) return;
    var sh = state.show, last = null, i;
    var big = function (v) { return fmt(v, v < 1000 && v % 1 !== 0 ? Math.min(dec, 1) : dec); };
    if ((sh.hl && typeof ex.dh === 'number' && typeof ex.dl === 'number') || (sh.vr && typeof ex.vr === 'number')) {
      a.appendChild(xrow(
        sh.hl && typeof ex.dh === 'number' ? '高 ' + big(ex.dh) + ' / 安 ' + big(ex.dl) : '',
        sh.vr && typeof ex.vr === 'number' ? ['出来高 ', bold(ex.vr + '倍')] : ''));
    }
    if (sh.rng && typeof ex.hi52 === 'number' && typeof ex.lo52 === 'number' && ex.hi52 > ex.lo52) {
      var rg = el('div', 'rg');
      var t = el('div', 't');
      t.appendChild(el('span', '', '52週 安 ' + big(ex.lo52)));
      t.appendChild(el('span', '', '高 ' + big(ex.hi52)));
      rg.appendChild(t);
      var bar = el('div', 'bar');
      var mk = el('i');
      var pos = Math.max(0, Math.min(100, (rec.price - ex.lo52) / (ex.hi52 - ex.lo52) * 100));
      mk.style.left = 'calc(' + pos + '% - 1px)';
      bar.appendChild(mk); rg.appendChild(bar);
      a.appendChild(rg);
    }
    if ((sh.rsi && typeof ex.rsi === 'number') || (sh.dev && typeof ex.dev === 'number')) {
      a.appendChild(xrow(
        sh.rsi && typeof ex.rsi === 'number' ? ['RSI ', bold(String(ex.rsi))] : '',
        sh.dev && typeof ex.dev === 'number' ? ['25日乖離 ', pctSpan(ex.dev)] : ''));
    }
    if (sh.ret && (typeof ex.r1 === 'number' || typeof ex.r1m === 'number' || typeof ex.r3 === 'number')) {
      var rr = el('div', 'xr');
      [['1週 ', ex.r1], ['1か月 ', ex.r1m], ['3か月 ', ex.r3]].forEach(function (p) {
        var sp = el('span'); sp.appendChild(document.createTextNode(p[0])); var v = pctSpan(p[1]); if (v) sp.appendChild(v); else sp.appendChild(document.createTextNode('—'));
        rr.appendChild(sp);
      });
      a.appendChild(rr);
      last = rr;
    }
    var rows = a.querySelectorAll('.xr, .rg');
    if (rows.length) rows[rows.length - 1].className += ' sp';
  }

  function render() {
    document.body.className = state.jp ? 'jp' : '';
    var size = state.size;
    var look = LOOK[size];
    renderTabs();
    var items = (currentTab().items || []).map(norm).slice(0, 500);
    var hasCat = items.some(function (it) { return !!it.cat; });
    var catColor = {}, catCount = 0;
    var catInfos = items.map(function (it, i) {
      if (!hasCat) return { has: false };
      if (!it.cat) return { has: true, label: '', bg: '#e6e9ee' };
      if (catColor[it.cat] === undefined) { catColor[it.cat] = PALETTE[catCount % PALETTE.length]; catCount++; }
      var first = i === 0 || items[i - 1].cat !== it.cat;
      return { has: true, label: first ? it.cat : '', bg: catColor[it.cat] };
    });
    var grid = document.getElementById('grid');
    grid.style.gridTemplateColumns = 'repeat(' + size + ', minmax(0, 1fr))';
    grid.style.gridTemplateRows = '';
    grid.style.gridAutoRows = 'auto';
    grid.style.setProperty('--chh', look.chh + 'px');
    grid.style.setProperty('--xs', look.xs + 'px');
    grid.style.setProperty('--name', look.name + 'px');
    grid.style.setProperty('--pct', look.pct + 'px');
    grid.style.setProperty('--price', look.price + 'px');
    grid.style.setProperty('--chg', look.chg + 'px');
    grid.style.setProperty('--code', look.code + 'px');
    while (grid.firstChild) grid.removeChild(grid.firstChild);
    items.forEach(function (it, i) {
      var t = buildTile(it, i, catInfos[i]);
      t.style.gridRow = String(Math.floor(i / size) + 1);
      t.style.gridColumn = String((i % size) + 1);
      grid.appendChild(t);
    });
    // カテゴリ名は、同じ行で続く同じカテゴリをひとまとめにして、中央に1つだけ表示します
    if (hasCat) {
      var i0 = 0;
      while (i0 < items.length) {
        var c = items[i0].cat, row = Math.floor(i0 / size), j = i0;
        while (j + 1 < items.length && items[j + 1].cat === c && Math.floor((j + 1) / size) === row) j++;
        var firstOfGroup = i0 === 0 || items[i0 - 1].cat !== c;
        var rowStart = (i0 % size) === 0;
        // 行をまたいだ続きにも、見失わないよう名前を表示します
        if (c && (firstOfGroup || rowStart)) {
          var lb = el('div', 'catlbl', c);
          lb.title = c;
          lb.style.background = catInfos[i0].bg;
          lb.style.gridRow = String(row + 1);
          lb.style.gridColumn = (i0 % size + 1) + ' / span ' + (j - i0 + 1);
          grid.appendChild(lb);
        }
        i0 = j + 1;
      }
    }

    var period = PERIODS.filter(function (p) { return p.key === state.period; })[0];
    document.getElementById('cap').textContent = (state.candle && state.period !== 'day') ? period.cap.replace(/（.*）/, '（ローソク足）') : period.cap;
    document.getElementById('title').textContent = watch.title || 'マイ株価ボード';
    document.title = watch.title || 'マイ株価ボード';

    var sub = items.length + '銘柄';
    if (data.updatedAt) {
      try {
        var d = new Date(data.updatedAt);
        sub = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short', hour: '2-digit', minute: '2-digit' }).format(d) + ' 更新 ／ ' + sub;
      } catch (e) { /* 日付を整形できなければ銘柄数のみ表示 */ }
    }
    document.getElementById('sub').textContent = sub;

    var pb = document.getElementById('periodBtns');
    var sb = document.getElementById('sizeBtns');
    PERIODS.forEach(function (p, i) { pb.children[i].setAttribute('aria-pressed', p.key === state.period ? 'true' : 'false'); });
    SIZES.forEach(function (n, i) { sb.children[i].setAttribute('aria-pressed', n === state.size ? 'true' : 'false'); });
    document.getElementById('jpBtn').setAttribute('aria-pressed', state.jp ? 'true' : 'false');
    document.getElementById('candleBtn').setAttribute('aria-pressed', state.candle ? 'true' : 'false');
    showNotices();
  }

  function showNotices() {
    var msgs = notices.slice();
    if (data.stopped) msgs.push('株価の取得が途中で中止されました。取得できなかった銘柄は前回のデータを表示しています。（' + data.stopped + '）');
    var box = document.getElementById('msg');
    box.textContent = msgs.join(' ／ ');
    box.style.display = msgs.length ? 'block' : 'none';
  }

  function makeButtons() {
    var pb = document.getElementById('periodBtns');
    PERIODS.forEach(function (p) {
      var b = el('button', 'btn', p.label);
      b.type = 'button';
      b.addEventListener('click', function () { state.period = p.key; save('period', p.key); render(); });
      pb.appendChild(b);
    });
    var sb = document.getElementById('sizeBtns');
    SIZES.forEach(function (n) {
      var b = el('button', 'btn', n + '列');
      b.type = 'button';
      b.addEventListener('click', function () { state.size = n; save('size', n); render(); });
      sb.appendChild(b);
    });
    var panel = document.getElementById('showPanel');
    var sbtn = document.getElementById('showBtn');
    SHOW_ITEMS.forEach(function (it) {
      var lab = el('label');
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = !!state.show[it.key];
      cb.addEventListener('change', function () { state.show[it.key] = cb.checked ? 1 : 0; save('show', JSON.stringify(state.show)); render(); });
      lab.appendChild(cb); lab.appendChild(document.createTextNode(it.label));
      panel.appendChild(lab);
    });
    sbtn.addEventListener('click', function () {
      var on = panel.className.indexOf('on') < 0;
      panel.className = on ? 'on' : '';
      sbtn.setAttribute('aria-expanded', on ? 'true' : 'false');
    });
    document.getElementById('candleBtn').addEventListener('click', function () { state.candle = !state.candle; save('candle', state.candle ? '1' : '0'); render(); });
    var ss = document.getElementById('siteSel');
    SITES.forEach(function (x) { var o = el('option', '', x.label); o.value = x.key; if (x.key === state.site) o.selected = true; ss.appendChild(o); });
    ss.addEventListener('change', function () { state.site = ss.value; save('site', state.site); render(); });
    document.getElementById('jpBtn').addEventListener('click', function () { state.jp = !state.jp; save('jp', state.jp ? '1' : '0'); render(); });

    var host = window.location.hostname;
    var m = /^([^.]+)\.github\.io$/.exec(host);
    var repo = window.location.pathname.split('/')[1];
    if (m && repo) {
      var base = 'https://github.com/' + m[1] + '/' + repo;
      var e = document.getElementById('editLink');
      e.href = base + '/edit/main/watchlist.json';
      e.hidden = false;
    }
  }

  function getJson(url) {
    return fetch(url, { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error(String(res.status));
      return res.json();
    });
  }

  makeButtons();
  render();

  getJson('watchlist.json').then(function (w) {
    watch = w;
    return getJson('data/latest.json').then(function (d) { data = d; }).catch(function () {
      notices.push('まだ株価データがありません。Chrome拡張機能「株価ボード データ取得」で、株価データを取得してください。');
    });
  }).catch(function () {
    notices.push('watchlist.json を読み込めませんでした。');
  }).then(render);
})();
</script>
</body>
</html>
