name: 株価データ更新

# 平日の16:30（日本時間）に自動で実行します。
# 手動で実行するときは、Actions タブでこのワークフローを選び「Run workflow」を押します。
on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = 10銘柄だけ試す / full = 全銘柄'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - full
      delay_sec:
        description: 'リクエストの間隔（秒）'
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 株価を取得する
        env:
          MODE: ${{ github.event.inputs.mode || 'full' }}
          DELAY_SEC: ${{ github.event.inputs.delay_sec || '5' }}
        run: node update.mjs

      - name: 結果を保存する
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更はありません"
          else
            git commit -m "株価データ更新"
            git push
          fi
